<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="A3EM">
  <!-- The A of the A3EM wordmark, on a tile so it holds its shape against any tab colour.
       Deliberately coarser than the full mark: at 16px the fine trace of the wordmark
       turns to mush, so this carries three peaks rather than six. -->
  <rect width="64" height="64" rx="13" fill="#1e4b3f"/>
  <path d="M14 50 L32 14 L50 50" fill="none" stroke="#e7efea" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M15 38 L20 38 L24 31 L28 46 L32 29 L36 44 L40 35 L44 38 L49 38" fill="none"
        stroke="#5dae86" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
