name: Deploy dashboard to Pages

# Also after a card helper release is published, so the dashboard knows of it and can tell
# people with an older helper that an update is available (see Web/app/vite.config.ts).
on:
  push:
    branches: [main]
    paths:
      - 'Web/**'
      - 'a3em-firmware'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: [Card helper release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A release that published: a tag's run that succeeded, not a manual test build.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Web
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # The card-helper-v* tags, for the newest release.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Web/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: npm ci
      - run: npm run ci

      - uses: actions/upload-pages-artifact@v5
        with:
          path: Web/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
