name: Card helper

# Unit tests on every platform, then each platform's integration test: a virtual disk
# (a loop device, an hdiutil image, a VHD) prepared exactly as the dashboard prepares a card.
# On Linux and macOS, the helper's own filesystem check and repairs are then held up against the
# system's checker, on a volume the system formatted and wrote and then damaged four ways.
# No real device is ever visible to these runs; A3EM_HELPER_VIRTUAL_ONLY hides them.

# Not for the notes, or the end-to-end scripts, which run on a computer rather than here.
on:
  push:
    paths:
      - 'Web/card-helper/**'
      - '!Web/card-helper/**/*.md'
      - '!Web/card-helper/test/e2e/**'
      - '.github/workflows/card-helper.yml'
  pull_request:
    paths:
      - 'Web/card-helper/**'
      - '!Web/card-helper/**/*.md'
      - '!Web/card-helper/test/e2e/**'
      - '.github/workflows/card-helper.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes a run still going.
concurrency:
  group: card-helper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Web/card-helper
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: Web/card-helper/go.mod
          cache: false

      - name: Vet and unit tests
        shell: bash
        run: |
          go vet ./...
          go test ./...

      # The extension's ID is written into the helper's registration; the dashboard's CI checked
      # it too, but no longer runs for the helper alone.
      - name: Extension ID matches
        if: runner.os == 'Linux'
        working-directory: Web
        run: node tools/sync-extension-manifest.mjs --check

      - name: Build
        shell: bash
        run: go build -o dist/ ./cmd/a3em-card-helper

      - name: Integration (Linux loop device)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq exfatprogs
          # The runners' cloud kernel keeps its exFAT driver in the extra modules package.
          sudo modprobe exfat || { sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" && sudo modprobe exfat; } || sudo apt-get install -y -qq exfat-fuse
          sudo --preserve-env=PATH test/integration-linux.sh dist/a3em-card-helper

      - name: Filesystem check against fsck.exfat (Linux)
        if: runner.os == 'Linux'
        run: sudo --preserve-env=PATH test/crosscheck-linux.sh dist/a3em-card-helper

      - name: Integration (macOS disk image)
        if: runner.os == 'macOS'
        run: test/integration-macos.sh dist/a3em-card-helper

      - name: Filesystem check against fsck_exfat (macOS)
        if: runner.os == 'macOS'
        run: test/crosscheck-macos.sh dist/a3em-card-helper

      - name: Integration (Windows VHD)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./test/integration-windows.ps1 -Helper dist/a3em-card-helper.exe
